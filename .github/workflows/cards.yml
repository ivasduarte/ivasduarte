name: Generate Profile Cards
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Fetch GitHub Contributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api graphql -F query='query { user(login: "ivasduarte") { contributionsCollection { contributionCalendar { weeks { contributionDays { contributionCount date weekday } } } } } }' > github-data.json
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install Dependencies
        run: pip install fonttools brotli
        
      - name: Run SVG Generator
        run: python generate_cards.py
        
      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cards/
          git commit -m "chore: update animated profile cards" || exit 0
          git push