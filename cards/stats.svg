<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 140" width="800" height="140">
<style>
@font-face { font-family: 'Inter'; src: url(data:font/woff;charset=utf-8;base64,) format('woff'); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
.card { opacity: 0; animation: fadeIn 0.8s ease 1.0s forwards; }
text { font-family: 'Inter', sans-serif; fill: #bcdae5; }
.title { fill: #9ba5f0; font-weight: bold; font-size: 20px; }
.sub { fill: #bcdae5; font-size: 14px; }
@media (prefers-reduced-motion: reduce) {
    .card { opacity: 1 !important; animation: none !important; transform: none !important; }
    .smil { display: none; }
}
</style>
<g class="card">
    <rect width="100%" height="100%" rx="8" fill="transparent" stroke="#9ba5f0" stroke-opacity="0.3"/>
    
        <text x="40" y="50" class="title">GitHub Stats &amp; Streaks</text>
        <text x="40" y="90" class="sub">Current Streak: <tspan fill="#9ba5f0">7 days</tspan></text>
        <text x="300" y="90" class="sub">Active Days: <tspan fill="#9ba5f0">89</tspan></text>
        <text x="560" y="90" class="sub">Busiest Day: <tspan fill="#9ba5f0">2026-11-03</tspan></text>
        
</g>
</svg>